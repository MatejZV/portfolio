
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding and responsive viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page information -->
    <meta name="description" content="Projects — Matej ZV’s developer portfolio, education, projects, and continued learning." data-i18n-content="meta.projects.description">
    <meta name="theme-color" content="#211D1B">
    <link rel="icon" type="image/svg+xml" sizes="any" href="assets/icons/favicon.svg">
    <title data-i18n="meta.projects.title">Projects | Matej ZV</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Projects | Matej ZV" data-i18n-content="meta.projects.title">
    <meta property="og:description" content="Projects — Matej ZV’s developer portfolio, education, projects, and continued learning." data-i18n-content="meta.projects.description">
    <meta name="twitter:card" content="summary">
    <!-- Add a canonical link and og:url once the final public URL is known.
         Add og:image only when a real share image has been supplied. -->

    <!-- Select the saved/system theme before styles render. -->
    <script src="js/theme.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>

    <!-- Website styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JavaScript loads after the HTML is parsed -->
    <script src="js/script.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#main-content" data-i18n="access.skip">Skip to main content</a>

    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation" data-i18n-aria-label="access.nav">

            <!-- Website logo -->
            <a href="index.html" class="logo" aria-label="Matej ZV home" data-i18n-aria-label="access.home">
                Matej <span>ZV</span>
            </a>

            <ul class="nav-links" id="primary-navigation">
                <li><a href="index.html" data-i18n="nav.home">Home</a></li>
                <li><a href="projects.html" aria-current="page" data-i18n="nav.projects">Projects</a></li>
                <li><a href="background.html" data-i18n="nav.background">Background</a></li>
                <li class="mobile-contact"><a href="contact.html" data-i18n="nav.contact">Contact Me</a></li>
            </ul>

            <div class="header-actions">
                <div class="settings-container">
                    <button id="settings-toggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel" hidden>
                        <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 3-.5 3-2 1.2L3.7 6 1.8 9.3l2.3 2v2.4l-2.3 2L3.7 19l2.8-1.2 2 1.2.5 3h4l.5-3 2-1.2 2.8 1.2 1.9-3.3-2.3-2v-2.4l2.3-2L18.3 6l-2.8 1.2-2-1.2-.5-3Z"/><circle cx="11" cy="12.5" r="3"/></svg>
                        <span data-i18n="settings.title">Settings</span>
                    </button>
                    <div id="settings-panel" class="settings-panel" role="group" aria-label="Display settings" hidden data-i18n-aria-label="settings.group">
                        <label class="theme-control" for="theme-choice" hidden>
                            <span data-i18n="settings.theme">Theme</span>
                            <select id="theme-choice" name="theme-choice" aria-label="Theme" data-i18n-aria-label="settings.theme">
                                <option value="dark" data-i18n="settings.dark">Dark</option>
                                <option value="light" data-i18n="settings.light">Light</option>
                            </select>
                        </label>
                        <fieldset class="language-control" hidden>
                            <legend data-i18n="settings.language">Language</legend>
                            <div class="language-options">
                                <button type="button" data-language="en" aria-pressed="true" lang="en"><span aria-hidden="true">🇬🇧</span> English <span class="language-check" aria-hidden="true">✓</span></button>
                                <button type="button" data-language="sl" aria-pressed="false" lang="sl"><span aria-hidden="true">🇸🇮</span> Slovenščina <span class="language-check" aria-hidden="true">✓</span></button>
                                <button type="button" data-language="de" aria-pressed="false" lang="de"><span aria-hidden="true">🇩🇪</span> Deutsch <span class="language-check" aria-hidden="true">✓</span></button>
                            </div>
                        </fieldset>
                    </div>
                </div>
                <a class="nav-contact btn btn-primary" href="contact.html" data-i18n="nav.contact">Contact Me</a>
                <!-- Mobile menu button -->
                <button
                    class="menu-toggle"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-controls="primary-navigation"
                    aria-expanded="false"
                 data-i18n-aria-label="access.menuOpen">
                    ☰
                </button>
            </div>


        </nav>
    </header>

    <main id="main-content" class="detail-page" tabindex="-1">
        <section tabindex="-1" id="work" class="projects-section">

            <p class="section-label" data-i18n="projects.label">
                MY WORK
            </p>

            <h1 data-i18n="nav.projects">Projects</h1>

            <p class="section-description" data-i18n="projects.intro">
                Projects I'm building and ideas
                I plan to explore.
            </p>

            <!--
                Project cards are generated automatically
                from the projects array in script.js.
            -->
            <div
                id="projects-container"
                class="projects-grid"
            ></div>

            <!-- Helpful message if JavaScript is disabled -->
            <noscript>
                <p data-i18n="projects.noScript">
                    Please enable JavaScript to view the
                    interactive project gallery.
                </p>
            </noscript>

        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="current-year">2026</span> <span data-i18n="footer.rights">Matej ZV. All rights reserved.</span></p>
    </footer>
    <!-- Translate parsed English content before deferred interaction scripts run. -->
    <script>window.portfolioI18n?.apply();</script>
</body>
</html>
